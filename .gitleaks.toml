# .gitleaks.toml — TurboLong secret-scanning configuration
# https://github.com/gitleaks/gitleaks
#
# ── Allowlisting false positives ───────────────────────────────────────────────
#
#   Option A — inline suppression (per-line, preferred for one-offs):
#     Add the comment  # gitleaks:allow  at the end of the offending line.
#     Example:
#       const TEST_KEY = "GBHD3V2XKX6DXHYZDSHA2UYZTO4MKB2R6QNSCDT4XEKNGTLPXT7A36EA"  # gitleaks:allow
#
#   Option B — allowlist block in this file (for whole patterns or paths):
#     Add an [[allowlists]] section below. Each entry needs a description.
#     It can match by regex on the secret value, commit hash, file path, or
#     the full regex of the rule ID.
#
#   Option C — .gitleaksignore file (commit-hash based):
#     Run:  gitleaks detect --report-format json --report-path findings.json
#     Then: gitleaks add <finding-fingerprint>  (creates/updates .gitleaksignore)
#
# ── Title ──────────────────────────────────────────────────────────────────────

title = "TurboLong Gitleaks Config"

# ── Extend the default rule set ────────────────────────────────────────────────
# Pulls in the built-in Gitleaks ruleset so we only need to add/override below.
[extend]
useDefault = true

# ── Custom rules ───────────────────────────────────────────────────────────────

# Stellar secret keys start with 'S' followed by 55 uppercase base32 chars.
#
# NOTE on case sensitivity: the key body MUST stay case-sensitive. Stellar
# strkeys are base32 (RFC 4648) and are always uppercase [A-Z2-7]. A blanket
# (?i) here makes `S[A-Z2-7]{55}` match any 56-char mixed-case alphanumeric
# run, which false-positives on ordinary base64 blobs (it previously fired on
# the VAPID *public* key in alerts/wrangler.toml). The (?i) is therefore
# scoped to the optional label prefix only, via the (?i:...) group.
[[rules]]
id          = "stellar-secret-key"
description = "Stellar secret key (Ed25519 seed)"
regex       = '''(?:(?i:stellar[_\-]?(?:secret|private|seed|sk)[_\-]?key)[\"\':\s=]+)?S[A-Z2-7]{55}'''
tags        = ["stellar", "key", "secret"]
severity    = "CRITICAL"

# Resend API key pattern (used in alerts worker)
[[rules]]
id          = "resend-api-key"
description = "Resend API key"
regex       = '''re_[a-zA-Z0-9]{32,}'''
tags        = ["resend", "api", "key"]
severity    = "HIGH"

# Cloudflare API token
[[rules]]
id          = "cloudflare-api-token"
description = "Cloudflare API token"
regex       = '''(?i)(cf[_\-]?(api[_\-]?)?token[\s\"\'=:]+)[a-zA-Z0-9_\-]{40,}'''
tags        = ["cloudflare", "token"]
severity    = "HIGH"

# Generic private key block (PEM / seed phrase style)
[[rules]]
id          = "private-key-block"
description = "PEM private key block"
regex       = '''-----BEGIN (RSA |EC |DSA |OPENSSH |PGP )?PRIVATE KEY-----'''
tags        = ["pem", "private-key"]
severity    = "CRITICAL"

# ── Global allowlist ───────────────────────────────────────────────────────────
# Paths, commits, and regex patterns that should NEVER trigger an alert.
#
# ⚠ MUST use the SINGULAR [allowlist] table, not the plural [[allowlists]]
# array-of-tables. The plural form is silently IGNORED by gitleaks 8.24.x —
# the version pinned by gitleaks/gitleaks-action@v3 in
# .github/workflows/secret-scan.yml — so entries placed there have no effect
# in CI even though they work with a newer gitleaks installed locally. That
# discrepancy previously made this whole section dead weight in CI.
#
# Because only ONE global [allowlist] table may exist, all global exemptions
# (paths and regexes) are merged below. If you bump the action/gitleaks
# version, re-verify before switching forms.

[allowlist]
description = "Global exemptions: generated/vendored files and public Stellar strkeys"

paths = [
  # Cargo.lock and package-lock files contain hashes that look like secrets
  '''Cargo\.lock''',
  '''package-lock\.json''',
  # Ledger snapshot JSON files are raw on-chain data — not secrets
  '''tests-snapshot-source/.*\.json''',
  # Generated report documents
  '''.*\.docx''',
]

# Public Stellar strkeys — contract IDs (C…) and account addresses (G…).
#
# Stellar encodes a type byte in the first character of every strkey:
#   G = ed25519 account public key   (public — an address)
#   C = contract ID                  (public — an address)
#   M = muxed account                (public)
#   S = ed25519 SECRET seed          (SECRET — never allowlist)
#
# So a 56-char base32 strkey beginning with G or C is, by construction, a
# public on-chain identifier and can never be a credential. This codebase
# refers to vault share tokens, underlying assets, pool and oracle contracts
# by their C… address in source, JSON manifests, and docs; gitleaks' built-in
# `generic-api-key` rule flags them purely because they sit next to an
# identifier containing the word "token" (e.g. `shareToken: "C…"`).
#
# This supersedes the previous list of individually enumerated addresses,
# which had to be extended by hand on every new deploy.
#
# Anchored so only a complete strkey is exempt, never a substring of some
# longer high-entropy value. Actual secret seeds start with S and are still
# caught by the `stellar-secret-key` rule above.
regexes = [
  '''^C[A-Z2-7]{55}$''',
  '''^G[A-Z2-7]{55}$''',
]
